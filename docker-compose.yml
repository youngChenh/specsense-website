version: '3.8'

services:
  api:
    build:
      context: ./specsense-api
      dockerfile: Dockerfile
    container_name: specsense-api
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://43.159.58.248/youthful_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: youthful
      SPRING_DATASOURCE_PASSWORD: Youthful@123456
      SPRING_REDIS_HOST: 43.159.58.248
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: redisYouthful123
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: specsense-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api

