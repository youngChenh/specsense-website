 server {
      server_name www.spesense.com 43.159.58.248;

      root /www/specsense/frontend/public;
      index index.html;

      location / {
          try_files $uri $uri/ /index.html;
      }

      location /api/ {
          proxy_pass http://127.0.0.1:8080/specsense/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      location /uploads/ {
          proxy_pass http://127.0.0.1:8080/specsense/uploads/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
      }

      location /admin/ {
          try_files $uri $uri/ /admin/index.html;
      }

      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
          expires 30d;
          add_header Cache-Control "public, immutable";
      }
  
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.spesense.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.spesense.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
 server {
    if ($host = www.spesense.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


      listen 80;
      server_name www.spesense.com 43.159.58.248;
    return 404; # managed by Certbot


}