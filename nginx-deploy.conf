server {
    listen 443 ssl;
    server_name www.spesense.com 43.159.58.248;

    client_max_body_size 100M;
    client_body_buffer_size 10M;

    ssl_certificate /etc/letsencrypt/live/www.spesense.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.spesense.com/privkey.pem;

    # API 请求转发到 Docker API
    location /specsense/api/ {
        proxy_pass http://127.0.0.1:8080/specsense/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件转发到 Docker API
    location ^~ /specsense/uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_max_temp_file_size 0;
    }

    # 前端请求转发到 Nuxt Server
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源缓存
    location ~* \.(js|css|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:3000;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
