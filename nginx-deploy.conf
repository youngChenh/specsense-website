server {
    listen 443 ssl;
    server_name www.spesense.com 43.159.58.248;

    # 允许上传大文件
    client_max_body_size 100M;
    client_body_buffer_size 10M;

    ssl_certificate /etc/letsencrypt/live/www.spesense.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.spesense.com/privkey.pem;

    root /www/specsense/frontend/public;
    index index.html;

    # 最高优先级，强制上传目录走代理
    location ^~ /specsense/uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_max_temp_file_size 0;
    }

    location /specsense/ {
        proxy_pass http://127.0.0.1:8080/specsense/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    location ~* \.(js|css|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}